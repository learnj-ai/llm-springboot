  name: Tutorial

  on:
    push:
      branches: [main]
      paths:
        - 'docs/tutorials/**'
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: pages
    cancel-in-progress: false

  jobs:
    build:
      name: Build tutorial book
      runs-on: ubuntu-latest
      env:
        TUTORIAL_PATH: docs/tutorials
      steps:
        - name: Clone the code
          uses: actions/checkout@v6

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
            node-version: 24

        - name: Install HonKit and plugins
          working-directory: ${{ env.TUTORIAL_PATH }}
          run: npm install

        - name: Build HonKit book
          working-directory: ${{ env.TUTORIAL_PATH }}
          run: npx honkit build . _book

        - name: Upload Pages artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: ${{ env.TUTORIAL_PATH }}/_book

    deploy:
      name: Deploy to GitHub Pages
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
