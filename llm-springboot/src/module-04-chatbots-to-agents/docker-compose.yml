version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: module04-postgres
    environment:
      POSTGRES_DB: workshop_module04
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop123
    ports:
      - "5432:5432"
    volumes:
      # Mount initialization script
      - ./src/main/resources/db/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop_module04"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - module04-network

  redis:
    image: redis:7-alpine
    container_name: module04-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - module04-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  module04-network:
    driver: bridge
