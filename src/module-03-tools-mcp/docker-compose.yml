version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: module03-postgres
    environment:
      POSTGRES_DB: workshop_module03
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop123
    ports:
      - "5432:5432"
    volumes:
      # Mount initialization scripts
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop_module03"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - module03-network

volumes:
  postgres_data:
    driver: local

networks:
  module03-network:
    driver: bridge
